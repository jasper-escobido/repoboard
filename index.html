<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoBoard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>RepoBoard</h1>

        <div class="btn-head">
            <button type="button" id="add-repo-btn">+</button>
            <button type="button" id="sync-btn">Refresh Data</button>
        </div>
        
    </header>
      
         <dialog id="repo-modal">
            <form>
                <label for="reponame">Repository Name</label>
                <input type="text" id="reponame" class="reponame">
                <label for="repodesc">Description</label>
                <textarea id="repodesc"></textarea>

                <button type="submit" id="submit-repo-btn">Add repo</button>
            </form>
            <button type="button" id="exit-btn">X</button>
         </dialog>

    <main>
        <section id="board-container"> 
        </section>
    </main>
    
</body>
</html>
